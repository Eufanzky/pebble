[project]
name = "focusbuddy-backend"
version = "0.1.0"
description = "Pebble (Focusbuddy) API: FastAPI backend for the Pebble companion."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "python-jose[cryptography]>=3.3.0",
    "httpx>=0.27.0",
    "python-multipart>=0.0.9",
    "pypdf>=6.19.0",
    "python-docx>=1.2.0",
]

[dependency-groups]
dev = [
    "asgi-lifespan>=2.1.0",
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "pytest-cov>=6.0",
    "respx>=0.22",
    "ruff>=0.9",
]

# The backend is an application, not a library: uv installs the dependencies only.
[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
# Real-LLM evals are opt-in: `uv run pytest -m eval`.
addopts = ["-m", "not eval", "--strict-markers"]
markers = [
    "eval: calls the real LLM provider; never runs on PRs",
]
filterwarnings = ["error"]

[tool.coverage.run]
source = ["app"]
branch = true

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = [
    "B008", # FastAPI's Depends(...) in argument defaults is the intended pattern
    # Deferred to phase 2, which rewrites this code. Fixing them now would change
    # behaviour (exception chaining, StrEnum's str()) right before 1.3 pins it.
    "B904",
    "UP042",
]

[tool.ruff.lint.per-file-ignores]
# Prompt text: rewrapping the lines would change what the model sees.
"app/application/prompts.py" = ["E501"]
