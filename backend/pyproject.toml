[project]
name = "pebble-backend"
version = "0.1.0"
description = "Pebble API: the FastAPI backend for the Pebble companion."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "python-jose[cryptography]>=3.3.0",
    "httpx>=0.27.0",
    "python-multipart>=0.0.9",
    "pypdf>=6.19.0",
    "python-docx>=1.2.0",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "alembic>=1.14",
]

[dependency-groups]
dev = [
    "asgi-lifespan>=2.1.0",
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "pytest-cov>=6.0",
    "respx>=0.22",
    "ruff>=0.9",
    "vulture>=2.16",
]

# The backend is an application, not a library: uv installs the dependencies only.
[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
# Real-LLM evals are opt-in: `uv run pytest -m eval`.
addopts = ["-m", "not eval", "--strict-markers"]
markers = [
    "eval: calls the real LLM provider; never runs on PRs",
]
filterwarnings = ["error"]

[tool.coverage.run]
source = ["app"]
branch = true

# Floors (specs/testing.md): 80% overall here; 90% on domain/ + application/ is checked in CI with
#   uv run coverage report --include="app/domain/*,app/application/*" --fail-under=90
[tool.coverage.report]
fail_under = 80
show_missing = true
skip_covered = true

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = [
    "B008", # FastAPI's Depends(...) in argument defaults is the intended pattern
    # Deferred to phase 2, which rewrites this code. Fixing them now would change
    # behaviour (exception chaining, StrEnum's str()) right before 1.3 pins it.
    "B904",
    "UP042",
]

[tool.ruff.lint.per-file-ignores]
# Prompt text: rewrapping the lines would change what the model sees.
"app/application/prompts.py" = ["E501"]

# Dead code (roadmap 6.1): `uv run vulture`. Routes, Pydantic config and fields, enum members and the
# middleware hook are used by the frameworks, not called directly, so they're not reported.
[tool.vulture]
paths = ["app", "tests"]
min_confidence = 60
exclude = ["app/api/schemas/"]
ignore_decorators = ["@router.*", "@app.*", "@pytest.fixture"]
ignore_names = ["model_config", "dispatch", "pytestmark", "created", "[A-Z][A-Z_]*"]
