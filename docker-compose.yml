# Local Postgres for the backend (roadmap 4.1): `docker compose up -d db`.
# The app uses the `pebble` database; the integration tests own `pebble_test`.
services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: pebble
      POSTGRES_PASSWORD: pebble
      POSTGRES_DB: pebble
    ports:
      - "5432:5432"
    volumes:
      - pebble-db:/var/lib/postgresql/data
      - ./backend/db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pebble"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pebble-db:
