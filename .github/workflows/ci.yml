# Roadmap 1.6: lint, typecheck and tests for both parts on every PR.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Dead code (unused files, exports and dependencies)
        run: npm run lint:dead
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Test with the coverage floor (80% on features/*/lib + hooks; includes the guilt scan)
        run: npm run test:coverage
      - name: Build
        run: npm run build

  backend:
    name: Backend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: pebble
          POSTGRES_PASSWORD: pebble
          POSTGRES_DB: pebble_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pebble"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # tests/integration: repositories and migrations on real Postgres; they fail rather than skip here.
      TEST_DATABASE_URL: postgresql+asyncpg://pebble:pebble@localhost:5432/pebble_test
      REQUIRE_TEST_DATABASE: "true"
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0 # no floating major tag
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: Install
        run: uv sync --locked
      - name: Lint
        run: uv run ruff check
      - name: Dead code
        run: uv run vulture
      - name: Test (coverage floor 80% overall)
        run: uv run pytest --cov
      - name: Coverage floor 90% on domain and application
        run: uv run coverage report --include="app/domain/*,app/application/*" --fail-under=90

  contract:
    name: API contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0 # no floating major tag
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - name: Regenerate the OpenAPI schema and the TS types
        run: npm run api:generate
        working-directory: frontend
      - name: Fail if they drifted from the committed copies
        run: git diff --exit-code -- frontend/src/shared/api


  e2e:
    name: E2E
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: pebble
          POSTGRES_PASSWORD: pebble
          POSTGRES_DB: pebble_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pebble"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0 # no floating major tag
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Demo flow and axe per page (backend with LLM_PROVIDER=fake)
        run: npm run test:e2e
      - name: Keep the report when it fails
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 7
