# Roadmap 2.8: real-LLM evals, weekly and on demand. Never on PRs, to protect the rate limits.
name: LLM evals

on:
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evals:
    name: Evals
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0 # no floating major tag
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - run: uv sync --locked
      - name: Run evals
        # The provider comes from repository settings. GitHub Models was retired on 2026-07-30 (A-018).
        # Without the LLM_API_KEY secret the evals skip, so the job stays green until a provider is chosen.
        env:
          LLM_PROVIDER: ${{ vars.LLM_PROVIDER || 'openai' }}
          LLM_BASE_URL: ${{ vars.LLM_BASE_URL }}
          LLM_MODEL: ${{ vars.LLM_MODEL }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
        run: uv run pytest -m eval -s -v
      - name: Upload the report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: eval-report
          path: backend/tests/evals/results/latest.json
          if-no-files-found: ignore
